<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IPTV</title>
<style>
html,body{margin:0;height:100%;background:#10151c;color:#eef2f6;font-family:Tahoma,Arial,sans-serif;overflow:hidden}
#login{position:absolute;top:0;left:0;right:0;bottom:0;padding:6% 25%;box-sizing:border-box}
#login h1{font-size:40px;margin:0 0 24px}
#login input,#login button{display:block;width:100%;box-sizing:border-box;font-size:28px;padding:14px;margin:0 0 16px;border:3px solid #34404f;border-radius:8px;background:#1a222d;color:#fff;direction:ltr;text-align:left}
#login button{background:#e8a317;color:#10151c;font-weight:bold;text-align:center;direction:rtl}
#login input:focus,#login button:focus{outline:none;border-color:#fff}
#msg{font-size:24px;color:#ffb4a8;min-height:34px}
#app{display:none;position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(180deg,#5b1d24 0%,#1b0c15 38%,#2b1235 100%)}
#hdr{height:80px;box-sizing:border-box;padding:8px 24px;font-size:32px;font-weight:bold;text-align:center;position:relative;border-bottom:1px solid rgba(255,255,255,.15);white-space:nowrap;overflow:hidden}
#ttl2{display:inline-block;max-width:60%;overflow:hidden;text-overflow:ellipsis;vertical-align:top;line-height:64px}
.rb{position:absolute;top:8px;width:64px;height:64px;line-height:64px;border-radius:50%;background:rgba(255,255,255,.16);text-align:center;font-size:32px;font-weight:normal;cursor:pointer}
.rb:hover{background:#e8a317;color:#10151c}
#sb{display:none;left:172px}
#srch{display:none;position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.88);z-index:50}
#sbox{margin:12% auto 0;width:60%}
#sh{font-size:32px;margin-bottom:16px}
#sq{width:100%;box-sizing:border-box;font-size:32px;padding:16px;border-radius:10px;border:3px solid #e8a317;background:#1a222d;color:#fff;margin-bottom:20px;text-align:right}
.dt{display:flex;padding:18px 28px}
.dp{width:26%;flex:none}
.dp img{width:100%;border-radius:14px;display:block}
.dx{flex:1;min-width:0;padding:0 28px}
.dtt{font-size:36px;font-weight:bold;margin-bottom:8px}
.dm{font-size:24px;color:#e8a317;margin-bottom:12px}
.dd{font-size:22px;line-height:1.6;color:#d6dbe3;max-height:190px;overflow:hidden;margin-bottom:16px}
.db .it{width:60%;border-radius:10px;margin-bottom:10px;background:rgba(255,255,255,.1)}
.db .it.sel{background:#e8a317}
.tr{display:flex;margin:14px 20px 0}
.tl{flex:1;margin:0 7px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:32px;font-weight:bold;color:#fff}
.tl.on{box-shadow:0 0 0 6px #fff}
.tl .tn{margin-top:10px}
.t1{background:linear-gradient(160deg,#2fe0b4,#1d5bd8);flex:1.25}
.t2{background:linear-gradient(135deg,#ee3f57,#f2a93b)}
.t3{background:linear-gradient(135deg,#7a3cf0,#2a79e8)}
.t4{background:#2fbf86;font-size:26px}
.ex{text-align:center;font-size:24px;margin-top:16px;color:#cfd6e0}
#rsm{display:none;position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.88);z-index:60}
#rbox{margin:12% auto 0;width:56%}
#rtt{font-size:32px;font-weight:bold;margin-bottom:10px}
#rq{font-size:26px;color:#d6dbe3;margin-bottom:22px}
#rbox .it{border-radius:10px;margin-bottom:12px;background:rgba(255,255,255,.12)}
#rbox .it.sel{background:#e8a317}
#hbk{right:20px}#pu{left:20px}#pd2{left:96px}
.it{height:56px;line-height:56px;padding:0 24px;box-sizing:border-box;font-size:28px;border-bottom:1px solid #222c39;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.it:hover{background:#34445a}
.sel{background:#e8a317;color:#10151c;font-weight:bold}
.nv{text-align:center;background:#243041;color:#e8a317;font-weight:bold}
.pb{display:inline-block;margin:0 10px;padding:4px 18px;background:#e8a317;color:#10151c;border-radius:8px;cursor:pointer;font-size:26px}
#list{position:absolute;top:80px;right:0;left:0;bottom:0;overflow:hidden}
#list.grid{padding:14px 20px 0;box-sizing:border-box}
.cd{display:inline-block;vertical-align:top;cursor:pointer}
.pst{background:linear-gradient(#2d2d3a,#17171f);border-radius:14px;overflow:hidden}
.pst img{width:100%;height:100%;object-fit:cover;display:block}
.pst.on{box-shadow:0 0 0 5px #e8a317}
.nm{font-size:22px;text-align:center;margin-top:8px;height:30px;line-height:30px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#player{display:none;position:absolute;top:0;left:0;right:0;bottom:0;background:#000}
#vid{width:100%;height:100%;background:#000}
#bar{position:absolute;top:0;left:0;right:0;padding:14px 22px;font-size:28px;background:rgba(0,0,0,.7)}
#bot{display:none;position:absolute;left:0;right:0;bottom:46px;padding:10px 26px;background:rgba(0,0,0,.6);direction:ltr;font-size:26px;align-items:center}
#bot span{width:110px;text-align:center;flex:none}
#pbar{flex:1;height:16px;background:rgba(255,255,255,.3);border-radius:8px;cursor:pointer;overflow:hidden}
#pfill{height:100%;width:0;background:#e8a317}
#status{position:absolute;bottom:0;left:0;right:0;padding:10px 22px;font-size:22px;background:rgba(0,0,0,.65)}
</style>
</head>
<body>

<div id="login">
  <h1>تسجيل الدخول</h1>
  <input id="srv" type="text" placeholder="رابط السيرفر مثال: http://example.com:8080">
  <input id="usr" type="text" placeholder="اليوزر">
  <input id="pwd" type="text" placeholder="الباسورد">
  <button id="go">دخول</button>
  <div id="msg"></div>
</div>

<div id="app">
  <div id="hdr"><span class="rb" id="hbk">→</span><span id="ttl2"></span><span class="rb" id="pu"><svg viewBox="0 0 24 24" width="34" height="34" style="vertical-align:middle"><polyline points="5,16 12,8 19,16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="rb" id="pd2"><svg viewBox="0 0 24 24" width="34" height="34" style="vertical-align:middle"><polyline points="5,8 12,16 19,8" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="rb" id="sb"><svg viewBox="0 0 24 24" width="34" height="34" style="vertical-align:middle"><circle cx="10" cy="10" r="6" fill="none" stroke="currentColor" stroke-width="2.6"/><line x1="15" y1="15" x2="21" y2="21" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></span></div>
  <div id="srch"><div id="sbox"><div id="sh"></div><input id="sq" type="text" placeholder="اضغط هنا واكتب الاسم"><span class="pb" id="sgo">بحث</span><span class="pb" id="scn">إلغاء</span></div></div>
  <div id="rsm"><div id="rbox"><div id="rtt"></div><div id="rq"></div><div class="it" id="rb1"></div><div class="it" id="rb2">تشغيل من البداية</div></div></div>
  <div id="list"></div>
</div>

<div id="player">
  <video id="vid" autoplay></video>
  <div id="bar"><span id="ttl"></span> <span id="tm"></span><br>
    <span class="pb" id="bk">رجوع</span><span class="pb" id="pv">▲ السابقة</span><span class="pb" id="nx">▼ التالية</span><span class="pb" id="rw">− 10 ثواني</span><span class="pb" id="pp">تشغيل / إيقاف</span><span class="pb" id="ff">+ 10 ثواني</span>
  </div>
  <div id="bot"><span id="tc">0:00</span><div id="pbar"><div id="pfill"></div></div><span id="td">0:00</span></div>
  <div id="status"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.8/hls.min.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var S = { base: '', u: '', p: '', stack: [], sc: null, cache: {}, hls: null, playing: false, p0: null, pi: 0, pl: [], vis: 8, lastAct: 0, hovEl: null, asking: null, searching: false, sv: 0, barT: 0 };
  var ROW = 56;
  var MAP = { 50: 38, 98: 38, 56: 40, 104: 40, 52: 37, 100: 37, 54: 39, 102: 39, 53: 13, 101: 13, 49: 33, 97: 33, 48: 8, 96: 8, 51: 34, 99: 34 };
  var NAMEMAP = { MediaPlay: 415, MediaPause: 19, MediaPlayPause: 179, MediaStop: 413, MediaRewind: 412, MediaFastForward: 417, MediaTrackNext: 176, MediaTrackPrevious: 177 };
  var MEDIA = { 415: 'play', 19: 'pause', 179: 'pp', 413: 'stop', 178: 'stop', 412: 'rw', 417: 'ff', 176: 'next', 425: 'next', 177: 'prev', 424: 'prev' };
  var NAMES = { live: 'مباشر', vod: 'أفلام', series: 'مسلسلات', all: 'كل الأقسام' };

  function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) {} return null; }
  function prog() { try { return JSON.parse(ls('iptv_prog') || '{}'); } catch (e) { return {}; } }
  function saveProg(o) { ls('iptv_prog', JSON.stringify(o)); }
  function msg(t) { $('msg').textContent = t || ''; }
  function hdr(t) { $('ttl2').textContent = t; }
  function esc(t) { return String(t || '').replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
  function enc(t) { return encodeURIComponent(t); }
  function arr(x) { return (x && x.length !== undefined) ? x : []; }
  function fmt(s) { s = Math.floor(s || 0); if (isNaN(s) || s < 0) return '0:00'; var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), c = s % 60; return (h ? h + ':' + (m < 10 ? '0' : '') : '') + m + ':' + (c < 10 ? '0' : '') + c; }

  function get(url, cb) {
    var x = new XMLHttpRequest(), done = false;
    function fin(err, d) { if (done) return; done = true; cb(err, d); }
    x.open('GET', url, true);
    x.timeout = 60000;
    x.onload = function () { if (x.status !== 200) return fin('status ' + x.status); try { fin(null, JSON.parse(x.responseText)); } catch (e) { fin('json'); } };
    x.onerror = function () { fin('network'); };
    x.ontimeout = function () { fin('timeout'); };
    try { x.send(); } catch (e) { fin('blocked'); }
  }
  function api(action, cb) {
    get(S.base + '/player_api.php?username=' + enc(S.u) + '&password=' + enc(S.p) + (action ? '&action=' + action : ''), cb);
  }
  function explain(err) {
    if (err === 'network' || err === 'blocked') return 'مش قادر يوصل للسيرفر. غالباً المتصفح بيمنع السيرفر http من صفحة https.';
    if (err === 'timeout') return 'السيرفر اتأخر في الرد. جرب تاني.';
    return 'حصل خطأ: ' + err;
  }

  function login() {
    var s = $('srv').value.replace(/\s/g, '');
    if (!/^https?:\/\//i.test(s)) s = 'http://' + s;
    S.base = s.replace(/\/+$/, '');
    S.u = $('usr').value.replace(/\s/g, '');
    S.p = $('pwd').value.replace(/\s/g, '');
    if (!S.base || !S.u || !S.p) { msg('املأ الخانات الثلاثة'); return; }
    msg('جاري الاتصال...');
    api('', function (err, info) {
      if (err) { msg(explain(err)); return; }
      if (!info || !info.user_info || info.user_info.auth === 0) { msg('اليوزر أو الباسورد غلط'); return; }
      S.exp = info.user_info.exp_date;
      ls('iptv_srv', S.base); ls('iptv_u', S.u); ls('iptv_p', S.p);
      msg('');
      S.cache = {}; S.stack = [];
      $('login').style.display = 'none';
      $('app').style.display = 'block';
      push(home());
    });
  }
  function logout() {
    ls('iptv_u', ''); ls('iptv_p', '');
    $('app').style.display = 'none';
    $('login').style.display = 'block';
    $('usr').value = ''; $('pwd').value = '';
    $('srv').focus();
  }

  /* ---------- screens ---------- */
  function clk() {
    var d = new Date(), h = d.getHours(), m = d.getMinutes(), ap = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m + ' ' + ap + '    ' + d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate();
  }
  function expTxt() {
    var e = parseInt(S.exp, 10);
    if (!e) return '';
    var d = new Date(e * 1000);
    return 'ينتهي الاشتراك: ' + d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate();
  }
  function accountScreen() {
    return { t: 'الحساب', i: 0, items: [
      { l: 'تحديث القوائم (يجيب الجديد من السيرفر)', f: function () { S.cache = {}; back(); hdr('تم تحديث القوائم'); } },
      { l: 'تغيير الحساب', f: logout }
    ] };
  }
  function home() {
    return { t: 'الرئيسية', i: 0, tiles: true, grid: true, sec: 'all', items: [
      { l: 'مباشر', f: function () { openSec('live'); } },
      { l: 'أفلام', f: function () { openSec('vod'); } },
      { l: 'مسلسلات', f: function () { openSec('series'); } },
      { l: 'متابعة المشاهدة', f: function () { push(contScreen()); } },
      { l: 'بحث شامل', f: openSrch },
      { l: 'الحساب والتحديث', f: function () { push(accountScreen()); } }
    ] };
  }
  function push(sc) { S.stack.push(sc); S.sc = sc; show(); }
  function back() {
    if (S.stack.length > 1) { S.stack.pop(); S.sc = S.stack[S.stack.length - 1]; show(); }
  }
  window.imgErr = function (el) {
    var u = el.src;
    if (u.indexOf('http:') === 0 && !el.r) { el.r = 1; el.src = u.replace('http:', 'https:'); } else { el.style.display = 'none'; }
  };
  function show() {
    var sc = S.sc, items = sc.items, h = '', W = window.innerWidth, H = window.innerHeight, i;
    hdr(S.stack.map(function (x) { return x.t; }).join(' › '));
    S.hovEl = null;
    $('sb').style.display = sc.sec ? 'block' : 'none';
    if (sc.tiles) {
      S.cols = 3; S.rv = 2;
      var av = H - 80 - 70, ics = ['<svg viewBox="0 0 64 64" width="100" height="100" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="22" width="48" height="34" rx="6"/><polyline points="22,8 32,18 42,8"/><polygon points="28,32 28,48 42,40" fill="#fff"/></svg>', '<svg viewBox="0 0 64 64" width="100" height="100" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="24"/><polygon points="26,21 26,43 45,32" fill="#fff"/></svg>', '<svg viewBox="0 0 64 64" width="100" height="100" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="26" width="48" height="30" rx="3"/><polygon points="8,12 56,12 56,22 8,22"/><line x1="22" y1="12" x2="16" y2="22"/><line x1="36" y1="12" x2="30" y2="22"/><line x1="50" y1="12" x2="44" y2="22"/></svg>'];
      var tile = function (n, cls) { return '<div class="tl ' + cls + (n === sc.i ? ' on' : '') + '" data-k="' + n + '">' + (ics[n] || '') + '<div class="tn">' + esc(items[n].l) + '</div></div>'; };
      h = '<div class="tr" style="height:' + Math.floor(av * 0.6) + 'px">' + tile(0, 't1') + tile(1, 't2') + tile(2, 't3') + '</div>' +
          '<div class="tr" style="height:' + Math.floor(av * 0.22) + 'px">' + tile(3, 't4') + tile(4, 't4') + tile(5, 't4') + '</div>' +
          '<div class="ex">' + esc(expTxt()) + '</div>';
      hdr(clk());
      $('list').className = '';
    } else if (sc.detail) {
      var d = sc.d;
      h = '<div class="dt"><div class="dp">' + (d.img ? '<img referrerpolicy="no-referrer" onerror="imgErr(this)" src="' + esc(d.img).replace(/"/g, '%22') + '">' : '') + '</div><div class="dx"><div class="dtt">' + esc(d.title) + '</div><div class="dm">' + esc(d.meta) + '</div><div class="dd">' + esc(d.plot === undefined ? 'جاري تحميل القصة...' : (d.plot || 'مفيش وصف متاح')) + '</div><div class="db">';
      for (i = 0; i < items.length; i++) h += '<div class="it' + (i === sc.i ? ' sel' : '') + '" data-k="' + i + '">' + esc(items[i].l) + '</div>';
      h += '</div></div></div>';
      $('list').className = '';
    } else if (sc.grid) {
      var g = 14, cols = Math.max(3, Math.min(8, Math.floor((W - 40) / 175)));
      var cw = Math.floor((W - 40) / cols) - g, ph = Math.round(cw * 1.42), ch = ph + 44 + g;
      var rv = Math.max(1, Math.floor((H - 100) / ch));
      S.cols = cols; S.rv = rv;
      var a = Math.floor(Math.floor(sc.i / cols) / rv) * rv * cols, z = Math.min(items.length, a + rv * cols);
      for (i = a; i < z; i++) {
        var it = items[i];
        h += '<div class="cd" data-k="' + i + '" style="width:' + cw + 'px;margin:0 ' + (g / 2) + 'px ' + g + 'px"><div class="pst' + (i === sc.i ? ' on' : '') + '" style="height:' + ph + 'px">' +
          (it.img ? '<img referrerpolicy="no-referrer" onerror="imgErr(this)" src="' + esc(it.img).replace(/"/g, '%22') + '">' : '') +
          '</div><div class="nm">' + esc(it.l) + '</div></div>';
      }
      $('list').className = 'grid';
    } else {
      S.vis = Math.max(3, Math.floor((H - 90) / ROW) - 2);
      var start = Math.max(0, Math.min(sc.i - Math.floor(S.vis / 2), items.length - S.vis));
      var end = Math.min(items.length, start + S.vis);
      h = '<div class="it nv" data-k="u">▲ للأعلى</div>';
      for (i = start; i < end; i++) {
        h += '<div class="it' + (i === sc.i ? ' sel' : '') + '" data-k="' + i + '">' + esc(items[i].l) + '</div>';
      }
      h += '<div class="it nv" data-k="d">▼ للأسفل</div>';
      $('list').className = '';
    }
    $('list').innerHTML = h;
  }
  function move(d) {
    var n = S.sc.items.length;
    if (!n) return;
    if (S.sc.tiles) {
      var t = S.sc.i + d;
      if (t < 0 || t >= n) return;
      if ((d === 1 || d === -1) && Math.floor(t / 3) !== Math.floor(S.sc.i / 3)) return;
    }
    S.sc.i = Math.max(0, Math.min(n - 1, S.sc.i + d));
    show();
  }
  function norm(t) { return String(t || '').toLowerCase().replace(/[\u064B-\u0652\u0640]/g, '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي'); }
  function openSrch() {
    if (!S.sc.sec) return;
    S.searching = true;
    $('srch').style.display = 'block';
    $('sh').textContent = 'بحث في ' + NAMES[S.sc.sec];
    $('sq').value = '';
    try { $('sq').focus(); } catch (e) {}
  }
  function closeSrch() { S.searching = false; $('srch').style.display = 'none'; try { $('sq').blur(); } catch (e) {} }
  function doSearch() {
    var raw = $('sq').value.replace(/^\s+|\s+$/g, ''), q = norm(raw), sec = S.sc.sec;
    if (!q) return;
    closeSrch();
    var secs = sec === 'all' ? ['live', 'vod', 'series'] : [sec], items = [], n = 0;
    function next() {
      if (n >= secs.length) {
        var title = 'بحث: ' + raw + ' (' + items.length + ')';
        if (!items.length) items = [{ l: 'مفيش نتايج', f: function () {} }];
        push({ t: title, i: 0, items: items, grid: sec !== 'live', sec: sec });
        return;
      }
      var cur = secs[n++];
      load(cur, function (e, c) {
        if (e) { hdr(explain(e)); return; }
        var res = c.all.filter(function (x) { return norm(x.name).indexOf(q) >= 0; });
        if (res.length) {
          var sub = listScreen(cur, { all: res }, '', '').items;
          if (sec === 'all') sub.forEach(function (x) { x.l = '[' + NAMES[cur] + '] ' + x.l; });
          items = items.concat(sub);
        }
        next();
      });
    }
    next();
  }
  function pick(i) {
    var it = S.sc.items[i];
    if (!it) return;
    if (Date.now() - S.lastAct < 400) return;
    S.lastAct = Date.now();
    S.sc.i = i;
    if (it.p) startPlay(it.p, i); else if (it.f) it.f();
  }

  function load(sec, cb) {
    if (S.cache[sec]) return cb(null, S.cache[sec]);
    var A = { live: ['get_live_categories', 'get_live_streams'], vod: ['get_vod_categories', 'get_vod_streams'], series: ['get_series_categories', 'get_series'] }[sec];
    hdr('جاري التحميل... (ممكن ياخد وقت)');
    api(A[0], function (e, cats) {
      if (e) return cb(e);
      api(A[1], function (e2, all) {
        if (e2) return cb(e2);
        S.cache[sec] = { cats: arr(cats), all: arr(all) };
        cb(null, S.cache[sec]);
      });
    });
  }
  function openSec(sec) {
    load(sec, function (e, c) {
      if (e) { hdr(explain(e)); return; }
      var items = [{ l: 'الكل (' + c.all.length + ')', f: function () { push(listScreen(sec, c, '', NAMES[sec])); } }];
      c.cats.forEach(function (ct) { items.push({ l: ct.category_name, f: function () { push(listScreen(sec, c, ct.category_id, ct.category_name)); } }); });
      push({ t: NAMES[sec], i: 0, items: items, sec: sec });
    });
  }
  function listScreen(sec, c, cid, title) {
    var src = cid === '' ? c.all : c.all.filter(function (s) { return String(s.category_id) === String(cid); });
    var base = S.base + '/', cr = '/' + enc(S.u) + '/' + enc(S.p) + '/';
    var items = src.map(function (s) {
      if (sec === 'live') return { l: s.name, img: s.stream_icon, p: { type: 'l', key: 'l' + s.stream_id, title: s.name, url: base + 'live' + cr + s.stream_id + '.m3u8', live: true } };
      if (sec === 'vod') return { l: s.name, img: s.stream_icon, f: function () { openMovie(s); } };
      return { l: s.name, img: s.cover, sub: String(s.plot || '').slice(0, 400), f: function () { openSeries(s); } };
    });
    if (!items.length) items = [{ l: 'مفيش حاجة هنا', f: function () {} }];
    return { t: title, i: 0, items: items, grid: sec !== 'live', sec: sec };
  }
  function meta(r, y, g, du) {
    var a = [];
    if (r && parseFloat(r) > 0) a.push('التقييم: ' + r + '/10');
    if (y) a.push(String(y).slice(0, 4));
    if (g) a.push(g);
    if (du) a.push(du);
    return a.join('   |   ');
  }
  function openMovie(s) {
    var p = { type: 'm', img: s.stream_icon, key: 'm' + s.stream_id, title: s.name, url: S.base + '/movie/' + enc(S.u) + '/' + enc(S.p) + '/' + s.stream_id + '.' + (s.container_extension || 'mp4'), vod: true };
    var sc = { t: s.name, i: 0, detail: true, d: { img: s.stream_icon, title: s.name, meta: meta(s.rating) }, items: [] };
    sc.refresh = function () { sc.items = [{ l: 'تشغيل', p: p }]; };
    sc.refresh();
    push(sc);
    api('get_vod_info&vod_id=' + s.stream_id, function (e, d) {
      var i = (d && d.info) || {};
      sc.d.plot = i.plot || i.description || '';
      sc.d.meta = meta(i.rating || s.rating, i.releasedate || i.release_date || i.year, i.genre, i.duration);
      if (!sc.d.img && i.movie_image) sc.d.img = i.movie_image;
      if (S.sc === sc) show();
    });
  }
  function openSeries(s) {
    hdr('جاري التحميل...');
    api('get_series_info&series_id=' + s.series_id, function (e, d) {
      if (e) { hdr(explain(e)); return; }
      var eps = (d && d.episodes) || {}, i = (d && d.info) || {};
      var ks = Object.keys(eps).sort(function (a, b) { return a - b; });
      if (!ks.length) { hdr('مفيش حلقات للمسلسل ده'); return; }
      function epScreen(k) {
        return { t: 'الموسم ' + k, i: 0, items: arr(eps[k]).map(function (x) {
          var im = (x.info && x.info.movie_image) || s.cover;
          return { l: (x.episode_num || '') + ' - ' + (x.title || 'حلقة'), img: im, p: { type: 'e', img: im, key: 'e' + x.id, title: s.name + ' - م' + k + ' ح' + (x.episode_num || ''), url: S.base + '/series/' + enc(S.u) + '/' + enc(S.p) + '/' + x.id + '.' + (x.container_extension || 'mp4'), vod: true } };
        }) };
      }
      var items = ks.map(function (k) {
        var n = arr(eps[k]).length;
        return { l: ks.length === 1 ? 'الحلقات (' + n + ')' : 'الموسم ' + k + ' (' + n + ' حلقة)', f: function () { push(epScreen(k)); } };
      });
      push({ t: s.name, i: 0, detail: true, items: items, d: { img: i.cover || s.cover, title: s.name, meta: meta(i.rating || s.rating, i.releaseDate || i.releasedate || s.releaseDate, i.genre), plot: i.plot || s.plot || '' } });
    });
  }
  function contScreen() {
    var P = prog(), a = [];
    for (var k in P) { if (P.hasOwnProperty(k)) a.push(P[k]); }
    a.sort(function (x, y) { return y.ts - x.ts; });
    var items = a.map(function (o) {
      var pc = o.dur ? Math.round(o.pos * 100 / o.dur) : 0;
      return { l: o.title + '  —  ' + pc + '%  (' + fmt(o.pos) + ')', img: o.img, p: { type: o.type, img: o.img, key: o.key, title: o.title, url: o.url, vod: true, go: true } };
    });
    if (items.length) items.push({ l: 'مسح السجل', f: function () { saveProg({}); S.stack.pop(); push(contScreen()); } });
    else items = [{ l: 'مفيش حاجة لسه. ابدأ فيلم أو حلقة وهتظهر هنا', f: function () {} }];
    return { t: 'متابعة المشاهدة', i: 0, items: items, grid: true };
  }

  /* ---------- player ---------- */
  function saveNow() {
    var v = $('vid'), p = S.p0;
    if (!p || !p.vod || !v.duration || isNaN(v.duration)) return;
    var P = prog();
    if (v.currentTime > v.duration * 0.95) { delete P[p.key]; }
    else if (v.currentTime > 10) { P[p.key] = { key: p.key, type: p.type, img: p.img, title: p.title, url: p.url, pos: v.currentTime, dur: v.duration, ts: Date.now() }; }
    saveProg(P);
  }
  function stopV() {
    var v = $('vid');
    if (S.hls) { try { S.hls.destroy(); } catch (e) {} S.hls = null; }
    try { v.pause(); v.removeAttribute('src'); v.load(); } catch (e) {}
  }
  function flashBar() {
    $('bar').style.display = 'block';
    $('bot').style.display = (S.p0 && S.p0.vod) ? 'flex' : 'none';
    updProg();
    clearTimeout(S.barT);
    S.barT = setTimeout(function () { $('bar').style.display = 'none'; $('bot').style.display = 'none'; }, 5000);
  }
  function drawAsk() {
    var a = S.asking;
    $('rsm').style.display = 'block';
    $('rtt').textContent = a.p.title;
    $('rq').textContent = 'كنت واقف عند ' + fmt(a.pos) + '. تحب تكمّل ولا تبدأ من الأول؟';
    $('rb1').textContent = 'كمّل من ' + fmt(a.pos);
    $('rb1').className = 'it' + (a.sel === 0 ? ' sel' : '');
    $('rb2').className = 'it' + (a.sel === 1 ? ' sel' : '');
  }
  function choose(n) {
    var a = S.asking;
    if (!a || Date.now() - a.t < 500) return;
    S.asking = null;
    $('rsm').style.display = 'none';
    realPlay(a.p, a.i, n === 0 ? Math.max(0, a.pos - 3) : 0);
  }
  function startPlay(p, i, noAsk) {
    var pr = p.vod && prog()[p.key], pos = (pr && pr.pos > 15) ? pr.pos : 0;
    if (!pos || p.nr) { realPlay(p, i, 0); return; }
    if (p.go || noAsk) { realPlay(p, i, Math.max(0, pos - 3)); return; }
    S.asking = { p: p, i: i, pos: pos, sel: 0, t: Date.now() };
    drawAsk();
  }
  function realPlay(p, i, resume) {
    var v = $('vid');
    stopV();
    S.p0 = p; S.pi = i; S.pl = S.sc.items; S.playing = true;
    resume = resume || 0;
    $('player').style.display = 'block';
    $('ttl').textContent = p.title;
    $('tm').textContent = '';
    $('status').style.display = 'block';
    $('status').textContent = resume ? 'جاري التشغيل... هيكمل من ' + fmt(resume) : 'جاري التشغيل...';
    var ep = p.type === 'e';
    ['pv', 'nx'].forEach(function (id) { $(id).style.display = (p.live || ep) ? 'inline-block' : 'none'; });
    $('pv').textContent = ep ? 'الحلقة السابقة' : 'السابقة';
    $('nx').textContent = ep ? 'الحلقة التالية' : 'التالية';
    ['rw', 'ff', 'pp'].forEach(function (id) { $(id).style.display = p.vod ? 'inline-block' : 'none'; });
    v.onplaying = function () { S.userPause = false; $('status').style.display = 'none'; };
    v.onpause = function () { if (S.userPause && S.playing) { $('status').style.display = 'block'; $('status').textContent = 'متوقف مؤقتاً'; } };
    v.onerror = function () { $('status').style.display = 'block'; $('status').textContent = 'مش شغال. ممكن القناة واقفة أو الشاشة مش بتدعم صيغة الفيديو (' + (p.url.split('.').pop()) + ')'; };
    v.onloadedmetadata = function () { if (resume) { try { v.currentTime = resume; } catch (e) {} } };
    v.ontimeupdate = function () {
      if (!p.vod) return;
      updProg();
      var n = Date.now();
      if (n - S.sv > 5000) { S.sv = n; saveNow(); }
    };
    v.onended = function () { saveNow(); if (p.type === 'e' && S.pl[S.pi + 1] && S.pl[S.pi + 1].p) zap(1); else closePlayer(); };
    if (p.live && window.Hls && Hls.isSupported()) {
      S.hls = new Hls({ lowLatencyMode: false });
      S.hls.on(Hls.Events.ERROR, function (ev, d) { if (d && d.fatal) { $('status').style.display = 'block'; $('status').textContent = 'القناة مش شغالة أو السيرفر رفض البث'; } });
      S.hls.loadSource(p.url);
      S.hls.attachMedia(v);
      S.hls.on(Hls.Events.MANIFEST_PARSED, function () { try { v.play(); } catch (e) {} });
    } else {
      v.src = p.url;
      try { v.play(); } catch (e) {}
    }
    flashBar();
  }
  function updProg() {
    var v = $('vid'), d = v.duration;
    $('tc').textContent = fmt(v.currentTime);
    $('td').textContent = (d && !isNaN(d) && d !== Infinity) ? fmt(d) : '--:--';
    $('pfill').style.width = (d && !isNaN(d) && d !== Infinity) ? Math.min(100, v.currentTime * 100 / d) + '%' : '0%';
  }
  function unk(c) {
    var st = $('status');
    st.style.display = 'block';
    st.textContent = 'زر غير معروف: ' + c;
    clearTimeout(S.unkT);
    S.unkT = setTimeout(function () { if (S.p0 && $('vid').currentTime > 0 && !S.userPause) st.style.display = 'none'; }, 3000);
  }
  function mediaKey(m) {
    var v = $('vid'), p = S.p0;
    if (m === 'play') { S.userPause = false; try { v.play(); } catch (e) {} flashBar(); }
    else if (m === 'pause') { S.userPause = true; v.pause(); flashBar(); }
    else if (m === 'pp') toggle();
    else if (m === 'stop') closePlayer();
    else if (m === 'rw') { if (p.vod) seek(-30); else flashBar(); }
    else if (m === 'ff') { if (p.vod) seek(30); else flashBar(); }
    else if (m === 'next') { if (p.live || p.type === 'e') zap(1); else seek(60); }
    else if (m === 'prev') { if (p.live || p.type === 'e') zap(-1); else seek(-60); }
  }
  function zap(d) {
    var j = S.pi + d;
    while (S.pl[j] && !S.pl[j].p) j += d;
    if (S.pl[j]) { S.sc.i = j; startPlay(S.pl[j].p, j, true); }
  }
  function seek(d) { var v = $('vid'); try { v.currentTime = Math.max(0, Math.min(v.duration || 1e9, v.currentTime + d)); } catch (e) {} flashBar(); }
  function toggle() { var v = $('vid'); if (v.paused) { S.userPause = false; try { v.play(); } catch (e) {} } else { S.userPause = true; v.pause(); } flashBar(); }
  function closePlayer() {
    saveNow(); stopV(); S.playing = false; S.p0 = null; $('player').style.display = 'none';
    if (S.sc && S.sc.refresh) { S.sc.refresh(); S.sc.i = Math.min(S.sc.i, S.sc.items.length - 1); }
    show();
  }
  function once(fn) { return function () { if (Date.now() - S.lastAct < 400) return; S.lastAct = Date.now(); fn(); }; }

  /* ---------- input ---------- */
  function isBack(k) { return k === 8 || k === 27 || k === 461 || k === 10009 || k === 10182 || k === 166; }

  document.addEventListener('keydown', function (e) {
    if (S.asking) {
      var ak = MAP[e.keyCode] || e.keyCode;
      if (ak === 38 || ak === 37) S.asking.sel = 0;
      else if (ak === 40 || ak === 39) S.asking.sel = 1;
      else if (ak === 13) { var hid = S.hovEl && S.hovEl.id; choose(hid === 'rb1' ? 0 : hid === 'rb2' ? 1 : S.asking.sel); e.preventDefault(); return; }
      else if (isBack(ak)) { S.asking = null; $('rsm').style.display = 'none'; e.preventDefault(); return; }
      else return;
      drawAsk();
      e.preventDefault();
      return;
    }
    if (S.searching) {
      if (e.keyCode === 13) {
        if (e.target && e.target.id === 'sq') { doSearch(); e.preventDefault(); }
        else if (S.hovEl && String(S.hovEl.className).indexOf('pb') >= 0) { S.hovEl.click(); e.preventDefault(); }
      } else if (e.keyCode === 27 || e.keyCode === 461 || e.keyCode === 10009 || e.keyCode === 10182) { closeSrch(); e.preventDefault(); }
      return;
    }
    var raw = NAMEMAP[e.key] || e.keyCode, k = MAP[raw] || raw;
    if ($('app').style.display !== 'block') return;
    var p = S.p0;
    if (S.playing) {
      var mk = MEDIA[raw];
      if (mk) { mediaKey(mk); e.preventDefault(); return; }
      if (isBack(k)) closePlayer();
      else if (k === 427 || k === 33) { if (p.live || p.type === 'e') zap(-1); else seek(-60); }
      else if (k === 428 || k === 34) { if (p.live || p.type === 'e') zap(1); else seek(60); }
      else if (k === 38) { if (p.live) zap(-1); else seek(-60); }
      else if (k === 40) { if (p.live) zap(1); else seek(60); }
      else if (k === 37) { if (p.vod) seek(-10); else flashBar(); }
      else if (k === 39) { if (p.vod) seek(10); else flashBar(); }
      else if (k === 13) {
        if (S.hovEl && String(S.hovEl.className).indexOf('pb') >= 0) S.hovEl.click();
        else if (p.vod) toggle(); else flashBar();
      } else { unk(raw); return; }
      e.preventDefault();
      return;
    }
    var g = S.sc.grid, pg = g ? S.cols * S.rv : S.vis - 1;
    if (k === 38) move(g ? -S.cols : -1);
    else if (k === 40) move(g ? S.cols : 1);
    else if (k === 33) move(-pg);
    else if (k === 34) move(pg);
    else if (g && k === 37) move(1);
    else if (g && k === 39) move(-1);
    else if (k === 37 || isBack(k)) back();
    else if (k === 13 || k === 39) {
      var hv = S.hovEl;
      if (k === 13 && hv && String(hv.className).indexOf('rb') >= 0) { hv.click(); }
      else {
        var h = hv;
        while (h && !(h.getAttribute && h.getAttribute('data-k'))) h = h.parentNode;
        if (k === 13 && h && $('list').contains(h)) listClick(h.getAttribute('data-k'));
        else pick(S.sc.i);
      }
    } else return;
    e.preventDefault();
  });

  function listClick(k) {
    var pg = S.sc.grid ? S.cols * S.rv : S.vis - 1;
    if (k === 'u') move(-pg);
    else if (k === 'd') move(pg);
    else pick(parseInt(k, 10));
  }
  $('list').onclick = function (e) {
    var t = e.target;
    while (t && !(t.getAttribute && t.getAttribute('data-k'))) t = t.parentNode;
    if (t) listClick(t.getAttribute('data-k'));
  };
  $('list').onwheel = function (e) { var st = S.sc.grid ? S.cols : 3; move(e.deltaY > 0 ? st : -st); if (e.preventDefault) e.preventDefault(); };
  document.onmouseover = function (e) { S.hovEl = e.target; };
  $('hbk').onclick = once(back);
  $('sb').onclick = once(openSrch);
  $('rb1').onclick = once(function () { choose(0); });
  $('rb2').onclick = once(function () { choose(1); });
  $('sgo').onclick = once(doSearch);
  $('scn').onclick = once(closeSrch);
  $('pu').onclick = once(function () { listClick('u'); });
  $('pd2').onclick = once(function () { listClick('d'); });
  $('bk').onclick = once(closePlayer);
  $('pv').onclick = once(function () { zap(-1); });
  $('nx').onclick = once(function () { zap(1); });
  $('rw').onclick = once(function () { seek(-10); });
  $('ff').onclick = once(function () { seek(10); });
  $('pp').onclick = once(toggle);
  $('player').onmousemove = flashBar;
  $('pbar').onclick = function (e) {
    var v = $('vid'), r = this.getBoundingClientRect();
    if (v.duration && !isNaN(v.duration)) { try { v.currentTime = Math.max(0, Math.min(v.duration, (e.clientX - r.left) / r.width * v.duration)); } catch (x) {} }
    flashBar();
  };
  $('vid').onclick = flashBar;
  setInterval(function () { if (S.sc && S.sc.tiles && !S.playing && !S.searching && !S.asking && $('app').style.display === 'block') hdr(clk()); }, 30000);
  $('go').onclick = login;
  document.addEventListener('keydown', function (e) {
    if (e.keyCode === 13 && $('login').style.display !== 'none' && $('app').style.display !== 'block') {
      if (e.target && e.target.tagName === 'INPUT') login();
    }
  });

  var a = ls('iptv_srv'), b = ls('iptv_u'), c = ls('iptv_p');
  if (a) $('srv').value = a;
  if (b) $('usr').value = b;
  if (c) $('pwd').value = c;
  if (a && b && c) login(); else $('srv').focus();
})();
</script>
</body>
</html>
