<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IPTV</title>
<style>
html,body{margin:0;height:100%;background:#10151c;color:#eef2f6;font-family:Tahoma,Arial,sans-serif;overflow:hidden}
#login{position:absolute;top:0;left:0;right:0;bottom:0;padding:6% 25%;box-sizing:border-box}
#login h1{font-size:40px;margin:0 0 24px}
#login input,#login button{display:block;width:100%;box-sizing:border-box;font-size:28px;padding:14px;margin:0 0 16px;border:3px solid #34404f;border-radius:8px;background:#1a222d;color:#fff;direction:ltr;text-align:left}
#login button{background:#e8a317;color:#10151c;font-weight:bold;text-align:center;direction:rtl}
#login input:focus,#login button:focus{outline:none;border-color:#fff}
#msg{font-size:24px;color:#ffb4a8;min-height:34px}
#app{display:none;position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(180deg,#5b1d24 0%,#1b0c15 38%,#2b1235 100%)}
#hdr{height:80px;box-sizing:border-box;padding:8px 24px;font-size:32px;font-weight:bold;text-align:center;position:relative;border-bottom:1px solid rgba(255,255,255,.15);white-space:nowrap;overflow:hidden}
#ttl2{display:inline-block;max-width:60%;overflow:hidden;text-overflow:ellipsis;vertical-align:top;line-height:64px}
.rb{position:absolute;top:8px;width:64px;height:64px;line-height:64px;border-radius:50%;background:rgba(255,255,255,.16);text-align:center;font-size:32px;font-weight:normal;cursor:pointer}
.rb:hover{background:#e8a317;color:#10151c}
#hbk{right:20px}#pu{left:20px}#pd2{left:96px}
.it{height:56px;line-height:56px;padding:0 24px;box-sizing:border-box;font-size:28px;border-bottom:1px solid #222c39;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.it:hover{background:#34445a}
.sel{background:#e8a317;color:#10151c;font-weight:bold}
.nv{text-align:center;background:#243041;color:#e8a317;font-weight:bold}
.pb{display:inline-block;margin:0 10px;padding:4px 18px;background:#e8a317;color:#10151c;border-radius:8px;cursor:pointer;font-size:26px}
#list{position:absolute;top:80px;right:0;left:0;bottom:0;overflow:hidden}
#list.grid{padding:14px 20px 0;box-sizing:border-box}
.cd{display:inline-block;vertical-align:top;cursor:pointer}
.pst{background:linear-gradient(#2d2d3a,#17171f);border-radius:14px;overflow:hidden}
.pst img{width:100%;height:100%;object-fit:cover;display:block}
.pst.on{box-shadow:0 0 0 5px #e8a317}
.nm{font-size:22px;text-align:center;margin-top:8px;height:30px;line-height:30px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#player{display:none;position:absolute;top:0;left:0;right:0;bottom:0;background:#000}
#vid{width:100%;height:100%;background:#000}
#bar{position:absolute;top:0;left:0;right:0;padding:14px 22px;font-size:28px;background:rgba(0,0,0,.7)}
#status{position:absolute;bottom:0;left:0;right:0;padding:10px 22px;font-size:22px;background:rgba(0,0,0,.65)}
</style>
</head>
<body>

<div id="login">
  <h1>تسجيل الدخول</h1>
  <input id="srv" type="text" placeholder="رابط السيرفر مثال: http://example.com:8080">
  <input id="usr" type="text" placeholder="اليوزر">
  <input id="pwd" type="text" placeholder="الباسورد">
  <button id="go">دخول</button>
  <div id="msg"></div>
</div>

<div id="app">
  <div id="hdr"><span class="rb" id="hbk">→</span><span id="ttl2"></span><span class="rb" id="pu">▲</span><span class="rb" id="pd2">▼</span></div>
  <div id="list"></div>
</div>

<div id="player">
  <video id="vid" autoplay></video>
  <div id="bar"><span id="ttl"></span> <span id="tm"></span><br>
    <span class="pb" id="bk">رجوع</span><span class="pb" id="pv">▲ السابقة</span><span class="pb" id="nx">▼ التالية</span><span class="pb" id="rw">⏪ 10</span><span class="pb" id="pp">⏯</span><span class="pb" id="ff">10 ⏩</span>
  </div>
  <div id="status"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.8/hls.min.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var S = { base: '', u: '', p: '', stack: [], sc: null, cache: {}, hls: null, playing: false, p0: null, pi: 0, pl: [], vis: 8, lastAct: 0, hovEl: null, sv: 0, barT: 0 };
  var ROW = 56;
  var MAP = { 50: 38, 98: 38, 56: 40, 104: 40, 52: 37, 100: 37, 54: 39, 102: 39, 53: 13, 101: 13, 49: 33, 97: 33, 48: 8, 96: 8, 51: 34, 99: 34 };
  var NAMES = { live: 'مباشر', vod: 'أفلام', series: 'مسلسلات' };

  function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) {} return null; }
  function prog() { try { return JSON.parse(ls('iptv_prog') || '{}'); } catch (e) { return {}; } }
  function saveProg(o) { ls('iptv_prog', JSON.stringify(o)); }
  function msg(t) { $('msg').textContent = t || ''; }
  function hdr(t) { $('ttl2').textContent = t; }
  function esc(t) { return String(t || '').replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
  function enc(t) { return encodeURIComponent(t); }
  function arr(x) { return (x && x.length !== undefined) ? x : []; }
  function fmt(s) { s = Math.floor(s || 0); if (isNaN(s) || s < 0) return '0:00'; var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), c = s % 60; return (h ? h + ':' + (m < 10 ? '0' : '') : '') + m + ':' + (c < 10 ? '0' : '') + c; }

  function get(url, cb) {
    var x = new XMLHttpRequest(), done = false;
    function fin(err, d) { if (done) return; done = true; cb(err, d); }
    x.open('GET', url, true);
    x.timeout = 60000;
    x.onload = function () { if (x.status !== 200) return fin('status ' + x.status); try { fin(null, JSON.parse(x.responseText)); } catch (e) { fin('json'); } };
    x.onerror = function () { fin('network'); };
    x.ontimeout = function () { fin('timeout'); };
    try { x.send(); } catch (e) { fin('blocked'); }
  }
  function api(action, cb) {
    get(S.base + '/player_api.php?username=' + enc(S.u) + '&password=' + enc(S.p) + (action ? '&action=' + action : ''), cb);
  }
  function explain(err) {
    if (err === 'network' || err === 'blocked') return 'مش قادر يوصل للسيرفر. غالباً المتصفح بيمنع السيرفر http من صفحة https.';
    if (err === 'timeout') return 'السيرفر اتأخر في الرد. جرب تاني.';
    return 'حصل خطأ: ' + err;
  }

  function login() {
    var s = $('srv').value.replace(/\s/g, '');
    if (!/^https?:\/\//i.test(s)) s = 'http://' + s;
    S.base = s.replace(/\/+$/, '');
    S.u = $('usr').value.replace(/\s/g, '');
    S.p = $('pwd').value.replace(/\s/g, '');
    if (!S.base || !S.u || !S.p) { msg('املأ الخانات الثلاثة'); return; }
    msg('جاري الاتصال...');
    api('', function (err, info) {
      if (err) { msg(explain(err)); return; }
      if (!info || !info.user_info || info.user_info.auth === 0) { msg('اليوزر أو الباسورد غلط'); return; }
      ls('iptv_srv', S.base); ls('iptv_u', S.u); ls('iptv_p', S.p);
      msg('');
      S.cache = {}; S.stack = [];
      $('login').style.display = 'none';
      $('app').style.display = 'block';
      push(home());
    });
  }
  function logout() {
    ls('iptv_u', ''); ls('iptv_p', '');
    $('app').style.display = 'none';
    $('login').style.display = 'block';
    $('usr').value = ''; $('pwd').value = '';
    $('srv').focus();
  }

  /* ---------- screens ---------- */
  function home() {
    return { t: 'الرئيسية', i: 0, items: [
      { l: '📺  مباشر', f: function () { openSec('live'); } },
      { l: '🎬  أفلام', f: function () { openSec('vod'); } },
      { l: '📼  مسلسلات', f: function () { openSec('series'); } },
      { l: '▶  متابعة المشاهدة', f: function () { push(contScreen()); } },
      { l: 'تغيير الحساب', f: logout }
    ] };
  }
  function push(sc) { S.stack.push(sc); S.sc = sc; show(); }
  function back() {
    if (S.stack.length > 1) { S.stack.pop(); S.sc = S.stack[S.stack.length - 1]; show(); }
  }
  window.imgErr = function (el) {
    var u = el.src;
    if (u.indexOf('http:') === 0 && !el.r) { el.r = 1; el.src = u.replace('http:', 'https:'); } else { el.style.display = 'none'; }
  };
  function show() {
    var sc = S.sc, items = sc.items, h = '', W = window.innerWidth, H = window.innerHeight, i;
    hdr(S.stack.map(function (x) { return x.t; }).join(' › '));
    S.hovEl = null;
    if (sc.grid) {
      var g = 14, cols = Math.max(3, Math.min(8, Math.floor((W - 40) / 175)));
      var cw = Math.floor((W - 40) / cols) - g, ph = Math.round(cw * 1.42), ch = ph + 44 + g;
      var rv = Math.max(1, Math.floor((H - 100) / ch));
      S.cols = cols; S.rv = rv;
      var a = Math.floor(Math.floor(sc.i / cols) / rv) * rv * cols, z = Math.min(items.length, a + rv * cols);
      for (i = a; i < z; i++) {
        var it = items[i];
        h += '<div class="cd" data-k="' + i + '" style="width:' + cw + 'px;margin:0 ' + (g / 2) + 'px ' + g + 'px"><div class="pst' + (i === sc.i ? ' on' : '') + '" style="height:' + ph + 'px">' +
          (it.img ? '<img referrerpolicy="no-referrer" onerror="imgErr(this)" src="' + esc(it.img).replace(/"/g, '%22') + '">' : '') +
          '</div><div class="nm">' + esc(it.l) + '</div></div>';
      }
      $('list').className = 'grid';
    } else {
      S.vis = Math.max(3, Math.floor((H - 90) / ROW) - 2);
      var start = Math.max(0, Math.min(sc.i - Math.floor(S.vis / 2), items.length - S.vis));
      var end = Math.min(items.length, start + S.vis);
      h = '<div class="it nv" data-k="u">▲ للأعلى</div>';
      for (i = start; i < end; i++) {
        h += '<div class="it' + (i === sc.i ? ' sel' : '') + '" data-k="' + i + '">' + esc(items[i].l) + '</div>';
      }
      h += '<div class="it nv" data-k="d">▼ للأسفل</div>';
      $('list').className = '';
    }
    $('list').innerHTML = h;
  }
  function move(d) {
    var n = S.sc.items.length;
    if (!n) return;
    S.sc.i = Math.max(0, Math.min(n - 1, S.sc.i + d));
    show();
  }
  function pick(i) {
    var it = S.sc.items[i];
    if (!it) return;
    if (Date.now() - S.lastAct < 400) return;
    S.lastAct = Date.now();
    S.sc.i = i;
    if (it.p) startPlay(it.p, i); else if (it.f) it.f();
  }

  function load(sec, cb) {
    if (S.cache[sec]) return cb(null, S.cache[sec]);
    var A = { live: ['get_live_categories', 'get_live_streams'], vod: ['get_vod_categories', 'get_vod_streams'], series: ['get_series_categories', 'get_series'] }[sec];
    hdr('جاري التحميل... (ممكن ياخد وقت)');
    api(A[0], function (e, cats) {
      if (e) return cb(e);
      api(A[1], function (e2, all) {
        if (e2) return cb(e2);
        S.cache[sec] = { cats: arr(cats), all: arr(all) };
        cb(null, S.cache[sec]);
      });
    });
  }
  function openSec(sec) {
    load(sec, function (e, c) {
      if (e) { hdr(explain(e)); return; }
      var items = [{ l: 'الكل (' + c.all.length + ')', f: function () { push(listScreen(sec, c, '', NAMES[sec])); } }];
      c.cats.forEach(function (ct) { items.push({ l: ct.category_name, f: function () { push(listScreen(sec, c, ct.category_id, ct.category_name)); } }); });
      push({ t: NAMES[sec], i: 0, items: items });
    });
  }
  function listScreen(sec, c, cid, title) {
    var src = cid === '' ? c.all : c.all.filter(function (s) { return String(s.category_id) === String(cid); });
    var base = S.base + '/', cr = '/' + enc(S.u) + '/' + enc(S.p) + '/';
    var items = src.map(function (s) {
      if (sec === 'live') return { l: s.name, img: s.stream_icon, p: { type: 'l', key: 'l' + s.stream_id, title: s.name, url: base + 'live' + cr + s.stream_id + '.m3u8', live: true } };
      if (sec === 'vod') return { l: s.name, img: s.stream_icon, sub: s.rating && s.rating !== '0' ? 'التقييم: ' + s.rating : '', p: { type: 'm', img: s.stream_icon, key: 'm' + s.stream_id, title: s.name, url: base + 'movie' + cr + s.stream_id + '.' + (s.container_extension || 'mp4'), vod: true } };
      return { l: s.name, img: s.cover, sub: String(s.plot || '').slice(0, 400), f: function () { openSeries(s); } };
    });
    if (!items.length) items = [{ l: 'مفيش حاجة هنا', f: function () {} }];
    return { t: title, i: 0, items: items, grid: sec !== 'live' };
  }
  function openSeries(s) {
    hdr('جاري التحميل...');
    api('get_series_info&series_id=' + s.series_id, function (e, d) {
      if (e) { hdr(explain(e)); return; }
      var eps = (d && d.episodes) || {};
      var ks = Object.keys(eps).sort(function (a, b) { return a - b; });
      if (!ks.length) { hdr('مفيش حلقات للمسلسل ده'); return; }
      function epScreen(k) {
        return { t: 'الموسم ' + k, i: 0, items: arr(eps[k]).map(function (x) {
          var im = (x.info && x.info.movie_image) || s.cover;
          return { l: (x.episode_num || '') + ' - ' + (x.title || 'حلقة'), img: im, sub: String((x.info && x.info.plot) || s.plot || '').slice(0, 400), p: { type: 'e', img: im, key: 'e' + x.id, title: s.name + ' - م' + k + ' ح' + (x.episode_num || ''), url: S.base + '/series/' + enc(S.u) + '/' + enc(S.p) + '/' + x.id + '.' + (x.container_extension || 'mp4'), vod: true } };
        }) };
      }
      if (ks.length === 1) { var one = epScreen(ks[0]); one.t = s.name; push(one); return; }
      push({ t: s.name, i: 0, items: ks.map(function (k) {
        return { l: 'الموسم ' + k + ' (' + arr(eps[k]).length + ' حلقة)', f: function () { push(epScreen(k)); } };
      }) });
    });
  }
  function contScreen() {
    var P = prog(), a = [];
    for (var k in P) { if (P.hasOwnProperty(k)) a.push(P[k]); }
    a.sort(function (x, y) { return y.ts - x.ts; });
    var items = a.map(function (o) {
      var pc = o.dur ? Math.round(o.pos * 100 / o.dur) : 0;
      return { l: o.title + '  —  ' + pc + '%  (' + fmt(o.pos) + ')', img: o.img, p: { type: o.type, img: o.img, key: o.key, title: o.title, url: o.url, vod: true } };
    });
    if (items.length) items.push({ l: 'مسح السجل', f: function () { saveProg({}); S.stack.pop(); push(contScreen()); } });
    else items = [{ l: 'مفيش حاجة لسه. ابدأ فيلم أو حلقة وهتظهر هنا', f: function () {} }];
    return { t: 'متابعة المشاهدة', i: 0, items: items, grid: true };
  }

  /* ---------- player ---------- */
  function saveNow() {
    var v = $('vid'), p = S.p0;
    if (!p || !p.vod || !v.duration || isNaN(v.duration)) return;
    var P = prog();
    if (v.currentTime > v.duration * 0.95) { delete P[p.key]; }
    else if (v.currentTime > 10) { P[p.key] = { key: p.key, type: p.type, img: p.img, title: p.title, url: p.url, pos: v.currentTime, dur: v.duration, ts: Date.now() }; }
    saveProg(P);
  }
  function stopV() {
    var v = $('vid');
    if (S.hls) { try { S.hls.destroy(); } catch (e) {} S.hls = null; }
    try { v.pause(); v.removeAttribute('src'); v.load(); } catch (e) {}
  }
  function flashBar() {
    $('bar').style.display = 'block';
    clearTimeout(S.barT);
    S.barT = setTimeout(function () { $('bar').style.display = 'none'; }, 5000);
  }
  function startPlay(p, i) {
    var v = $('vid');
    stopV();
    S.p0 = p; S.pi = i; S.pl = S.sc.items; S.playing = true;
    var pr = prog()[p.key], resume = (pr && pr.pos > 15) ? pr.pos - 3 : 0;
    $('player').style.display = 'block';
    $('ttl').textContent = p.title;
    $('tm').textContent = '';
    $('status').style.display = 'block';
    $('status').textContent = resume ? 'جاري التشغيل... هيكمل من ' + fmt(resume) : 'جاري التشغيل...';
    ['pv', 'nx'].forEach(function (id) { $(id).style.display = p.live ? 'inline-block' : 'none'; });
    ['rw', 'ff', 'pp'].forEach(function (id) { $(id).style.display = p.vod ? 'inline-block' : 'none'; });
    v.onplaying = function () { $('status').style.display = 'none'; };
    v.onerror = function () { $('status').style.display = 'block'; $('status').textContent = 'مش شغال. ممكن القناة واقفة أو الشاشة مش بتدعم صيغة الفيديو (' + (p.url.split('.').pop()) + ')'; };
    v.onloadedmetadata = function () { if (resume) { try { v.currentTime = resume; } catch (e) {} } };
    v.ontimeupdate = function () {
      if (!p.vod) return;
      $('tm').textContent = fmt(v.currentTime) + ' / ' + fmt(v.duration);
      var n = Date.now();
      if (n - S.sv > 5000) { S.sv = n; saveNow(); }
    };
    v.onended = function () { saveNow(); closePlayer(); };
    if (p.live && window.Hls && Hls.isSupported()) {
      S.hls = new Hls({ lowLatencyMode: false });
      S.hls.on(Hls.Events.ERROR, function (ev, d) { if (d && d.fatal) { $('status').style.display = 'block'; $('status').textContent = 'القناة مش شغالة أو السيرفر رفض البث'; } });
      S.hls.loadSource(p.url);
      S.hls.attachMedia(v);
      S.hls.on(Hls.Events.MANIFEST_PARSED, function () { try { v.play(); } catch (e) {} });
    } else {
      v.src = p.url;
      try { v.play(); } catch (e) {}
    }
    flashBar();
  }
  function zap(d) {
    var j = S.pi + d;
    while (S.pl[j] && !S.pl[j].p) j += d;
    if (S.pl[j]) { S.sc.i = j; startPlay(S.pl[j].p, j); }
  }
  function seek(d) { var v = $('vid'); try { v.currentTime = Math.max(0, Math.min(v.duration || 1e9, v.currentTime + d)); } catch (e) {} flashBar(); }
  function toggle() { var v = $('vid'); if (v.paused) { try { v.play(); } catch (e) {} } else { v.pause(); } flashBar(); }
  function closePlayer() { saveNow(); stopV(); S.playing = false; S.p0 = null; $('player').style.display = 'none'; show(); }
  function once(fn) { return function () { if (Date.now() - S.lastAct < 400) return; S.lastAct = Date.now(); fn(); }; }

  /* ---------- input ---------- */
  function isBack(k) { return k === 8 || k === 27 || k === 461 || k === 10009 || k === 10182 || k === 166; }

  document.addEventListener('keydown', function (e) {
    var k = MAP[e.keyCode] || e.keyCode;
    if ($('app').style.display !== 'block') return;
    var p = S.p0;
    if (S.playing) {
      if (isBack(k)) closePlayer();
      else if (k === 38 || k === 427 || k === 33) { if (p.live) zap(-1); else seek(-60); }
      else if (k === 40 || k === 428 || k === 34) { if (p.live) zap(1); else seek(60); }
      else if (k === 37) { if (p.vod) seek(-10); else flashBar(); }
      else if (k === 39) { if (p.vod) seek(10); else flashBar(); }
      else if (k === 13) {
        if (S.hovEl && String(S.hovEl.className).indexOf('pb') >= 0) S.hovEl.click();
        else if (p.vod) toggle(); else flashBar();
      } else return;
      e.preventDefault();
      return;
    }
    var g = S.sc.grid, pg = g ? S.cols * S.rv : S.vis - 1;
    if (k === 38) move(g ? -S.cols : -1);
    else if (k === 40) move(g ? S.cols : 1);
    else if (k === 33) move(-pg);
    else if (k === 34) move(pg);
    else if (g && k === 37) move(1);
    else if (g && k === 39) move(-1);
    else if (k === 37 || isBack(k)) back();
    else if (k === 13 || k === 39) {
      var hv = S.hovEl;
      if (k === 13 && hv && String(hv.className).indexOf('rb') >= 0) { hv.click(); }
      else {
        var h = hv;
        while (h && !(h.getAttribute && h.getAttribute('data-k'))) h = h.parentNode;
        if (k === 13 && h && h.parentNode && h.parentNode.id === 'list') listClick(h.getAttribute('data-k'));
        else pick(S.sc.i);
      }
    } else return;
    e.preventDefault();
  });

  function listClick(k) {
    var pg = S.sc.grid ? S.cols * S.rv : S.vis - 1;
    if (k === 'u') move(-pg);
    else if (k === 'd') move(pg);
    else pick(parseInt(k, 10));
  }
  $('list').onclick = function (e) {
    var t = e.target;
    while (t && !(t.getAttribute && t.getAttribute('data-k'))) t = t.parentNode;
    if (t) listClick(t.getAttribute('data-k'));
  };
  $('list').onwheel = function (e) { var st = S.sc.grid ? S.cols : 3; move(e.deltaY > 0 ? st : -st); if (e.preventDefault) e.preventDefault(); };
  document.onmouseover = function (e) { S.hovEl = e.target; };
  $('hbk').onclick = once(back);
  $('pu').onclick = once(function () { listClick('u'); });
  $('pd2').onclick = once(function () { listClick('d'); });
  $('bk').onclick = once(closePlayer);
  $('pv').onclick = once(function () { zap(-1); });
  $('nx').onclick = once(function () { zap(1); });
  $('rw').onclick = once(function () { seek(-10); });
  $('ff').onclick = once(function () { seek(10); });
  $('pp').onclick = once(toggle);
  $('player').onmousemove = flashBar;
  $('vid').onclick = flashBar;
  $('go').onclick = login;
  document.addEventListener('keydown', function (e) {
    if (e.keyCode === 13 && $('login').style.display !== 'none' && $('app').style.display !== 'block') {
      if (e.target && e.target.tagName === 'INPUT') login();
    }
  });

  var a = ls('iptv_srv'), b = ls('iptv_u'), c = ls('iptv_p');
  if (a) $('srv').value = a;
  if (b) $('usr').value = b;
  if (c) $('pwd').value = c;
  if (a && b && c) login(); else $('srv').focus();
})();
</script>
